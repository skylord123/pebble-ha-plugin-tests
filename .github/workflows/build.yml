name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Pebble SDK
        run: |
          pipx install uv  # pebble-tool 5.1+ builds the SDK's venv with uv
          pipx install pebble-tool
          pebble sdk install latest

      - name: Build
        run: scripts/build.sh ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: pbws
          path: dist/*.pbw

  # Every push to main replaces the `latest` release, so the newest pbws can
  # be downloaded on the phone and opened with the Pebble app.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pbws
          path: dist

      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.pbw --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7} on every push to main. Open a pbw with the Pebble app to install it."
